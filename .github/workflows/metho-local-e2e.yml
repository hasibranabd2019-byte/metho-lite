name: METHO Lite isolated local E2E
on:
  push:
    branches: [qa/full-e2e-2026-11-03]
  workflow_dispatch:
jobs:
  local-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save wrangler@4.40.0
      - name: Apply migrations to isolated local D1
        run: npx wrangler d1 migrations apply metho-lite-db --local --persist-to .wrangler/state
      - name: Start local Worker with local D1
        run: |
          nohup npx wrangler dev --local --port 8787 --persist-to .wrangler/state > /tmp/metho-wrangler.log 2>&1 &
          echo $! > /tmp/metho-wrangler.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/metho-wrangler.log
          exit 1
      - name: Run API and workflow tests
        run: node tests/e2e-local.mjs
      - name: Upload local Worker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metho-lite-local-e2e-log
          path: /tmp/metho-wrangler.log
          if-no-files-found: ignore
          retention-days: 7
