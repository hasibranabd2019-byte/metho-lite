<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>মেঠো | ইনভয়েস</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js" defer></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script><script src="/invoice.js?v=7" defer></script></head><body><main><h1>মেঠো ইনভয়েস</h1><p id="invoice-status">ইনভয়েস প্রস্তুত হচ্ছে…</p><button id="invoice-download" data-invoice-token="" hidden>ইনভয়েস ডাউনলোড</button><p>লিংকটি ৯০ দিন কার্যকর থাকবে।</p></main><script>window.addEventListener("DOMContentLoaded",()=>{const token=new URLSearchParams(location.search).get("token")||"",b=document.getElementById("invoice-download"),s=document.getElementById("invoice-status");if(!/^[A-Za-z0-9_-]{40,60}$/.test(token)){s.textContent="লিংকটি সঠিক নয় বা মেয়াদ শেষ।";return;}b.dataset.invoiceToken=token;b.hidden=false;s.textContent="ইনভয়েস তৈরি ও ডাউনলোড করতে নিচের বোতামে চাপ দিন।";});</script></body></html>
