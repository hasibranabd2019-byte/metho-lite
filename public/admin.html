<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METHO Lite Admin</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body><header><a href="/">মেঠো</a> অ্যাডমিন প্যানেল</header><main><section id="auth" class="panel"><h1>অ্যাডমিন প্রবেশ</h1><div id="setup" hidden><p>প্রথমবার দুইজন অ্যাডমিনের অ্যাকাউন্ট তৈরি করুন।</p><form id="setup-form"><div class="two"><label>অ্যাডমিন ১ ইউজারনেম<input name="u1" required minlength="3" maxlength="30"></label><label>নাম<input name="n1" required maxlength="60"></label><label>পাসওয়ার্ড (কমপক্ষে ১২ অক্ষর)<input name="p1" type="password" required minlength="12"></label><label>অ্যাডমিন ২ ইউজারনেম<input name="u2" required minlength="3" maxlength="30"></label><label>নাম<input name="n2" required maxlength="60"></label><label>পাসওয়ার্ড (কমপক্ষে ১২ অক্ষর)<input name="p2" type="password" required minlength="12"></label></div><button class="primary">অ্যাকাউন্ট তৈরি</button></form></div><div id="login"><form id="login-form"><label>ইউজারনেম<input name="username" required></label><label>পাসওয়ার্ড<input name="password" type="password" required></label><button class="primary">লগইন</button></form></div><p id="message"></p></section><section id="dashboard" hidden><div class="bar"><h1>অর্ডার ও পণ্য</h1><button id="logout">লগআউট</button></div><nav><button data-tab="orders">অর্ডার</button><button data-tab="variants">দাম ও স্টক</button></nav><div id="orders"></div><div id="variants" hidden></div></section></main></body></html>
